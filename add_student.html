<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Add Student</h2>

        <label>Roll Number: </label>
        <input type="text" id="RollNo" placeholder="Enter roll number (e.g. 24CSB01)">

        <label>Name: </label>
        <input type="text" id="Name" placeholder="Enter name">

        <label>Branch: </label>
        <input type="text" id="Branch" placeholder="Enter branch">

        <button onclick="addStudent()">Add Student</button>
        <p id="message" class="msg"></p>

        <div class="back">
            <a href="index.html">Back to Home page</a>
        </div>
    </div>

    <script>
        function addStudent() {
        let roll = document.getElementById("RollNo").value;
        let name = document.getElementById("Name").value;
        let branch = document.getElementById("Branch").value;

        if (!roll || !name || !branch) {
            document.getElementById("message").innerText = "All fields are required!";
            document.getElementById("message").style.color = "red";
            return;
        }

        const rollPattern = /^\d{2}(CS|EC|EE|ME|CE|CH|BT|MT|PH)\d{1}[A-Z]\d{2}$/i;
        if (!rollPattern.test(roll)) {
            document.getElementById("message").innerText = "Roll number must follow YYBRC0NO format, e.g. 24CSB01";
            document.getElementById("message").style.color = "red";
            return;
        }

        fetch(`${window.location.origin}/addStudent`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ roll_no: roll, name: name, branch: branch })
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById("message").innerText = data.message;
            document.getElementById("message").style.color = "green";
        })
        .catch(err => {
            document.getElementById("message").innerText = "Error connecting to server";
            document.getElementById("message").style.color = "red";
        });
        }
    </script>
</body>
</html>
