<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>View Health Records</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div class="container">
            <div class="dashboard-header compact">
                <div>
                    <p class="eyebrow">Student access</p>
                    <h2>View Health Records</h2>
                </div>
                <button class="secondary" onclick="logout()">Logout</button>
            </div>

            <label>Roll Number</label>
            <input type="text" id="rollNo" placeholder="Enter roll number">

            <button onclick="viewHealth()">View Records</button>

            <p id="message" class="msg"></p>
            <div id="records" style="margin-top:20px;"></div>

            <div id="prescriptionModal"
                style="display:none; position:fixed; top:50%; left:50%;
                transform:translate(-50%,-50%);
                background:white; padding:20px;
                border:1px solid black;
                border-radius:10px;
                box-shadow:0px 0px 10px gray;">

                <h3>Prescription Details</h3>

                <div id="prescriptionTable"></div>

                <br>

                <button onclick="closePrescription()">Close</button>

            </div>

            <div class="back-btn">
                <a id="backLink" href="index.html">Back to Dashboard</a>
            </div>
        </div>

        <script>
            function viewHealth(rollNo = null) 
            {
                const roll_no = rollNo || document.getElementById("rollNo").value;

                if (!roll_no) {
                    document.getElementById("message").innerText = "Enter a roll number!";
                    document.getElementById("message").style.color = "red";
                    return;
                }

                fetch(`${window.location.origin}/viewHealth/${roll_no}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.message) {
                            document.getElementById("message").innerText = data.message;
                            document.getElementById("message").style.color = "red";
                            document.getElementById("records").innerHTML = "";
                            return;
                        }

                        document.getElementById("message").innerText = `Health records for ${data.student.name} (Branch: ${data.student.branch})`;
                        document.getElementById("message").style.color = "green";

                        let html = `
                        <table border='1' cellpadding='8' cellspacing ='0'>
                            <tr>
                                <th>#</th>
                                <th>Symptoms</th>
                                <th>Date</th>
                                <th>Prescription</th>
                            </tr>
                        `;

                        data.records.forEach((rec, idx) => {
                            html += `
                            <tr>
                                <td>${idx + 1}</td>
                                <td>${rec.symptoms}</td>
                                <td>${new Date(rec.date).toLocaleDateString()}</td>
                                <td>
                                    <button onclick='showPrescription(${JSON.stringify(rec.prescription)})'>
                                        View Prescription
                                    </button>
                                </td>
                            </tr>`;
                        });

                        html += "</table>";

                        document.getElementById("records").innerHTML = html;
                    })
                    .catch(err => {
                        document.getElementById("message").innerText = "Error fetching records!";
                        document.getElementById("message").style.color = "red";
                        document.getElementById("records").innerHTML = "";
                    });
            }

            function showPrescription(prescriptionList)
            {
                if (!prescriptionList || prescriptionList.length === 0) {
                    alert("No prescription data available.");
                    return;
                }

                let table = `
                <table border="1" cellpadding="8" cellspacing="0">
                    <tr>
                        <th>Medicine</th>
                        <th>Dose</th>
                        <th>Time</th>
                    </tr>
                `;

                prescriptionList.forEach(item => {
                    table += `
                    <tr>
                        <td>${item.medicine_name}</td>
                        <td>${item.dose}</td>
                        <td>${item.time_intake}</td>
                    </tr>`;
                });

                table += "</table>";

                document.getElementById("prescriptionTable").innerHTML = table;
                document.getElementById("prescriptionModal").style.display = "block";
            }

            function closePrescription()
            {
                document.getElementById("prescriptionModal").style.display = "none";
            }

            function logout() {
                sessionStorage.clear();
                window.location.href = 'login.html';
            }

            const savedRollNo = sessionStorage.getItem('rollNo') || sessionStorage.getItem('studentRollNo') || '';
            const userRole = sessionStorage.getItem('userRole');

            if (userRole === 'student') {
                document.getElementById('backLink').textContent = 'Back to Login';
                document.getElementById('backLink').href = 'login.html';
            }

            if (savedRollNo) {
                document.getElementById('rollNo').value = savedRollNo;
                if (userRole === 'student') {
                    document.getElementById('message').innerText = 'Loading your records...';
                    document.getElementById('message').style.color = '#3452d9';
                    viewHealth(savedRollNo);
                }
            }

            if (!userRole) {
                window.location.href = 'login.html';
            }
        </script>
    </body>
</html>
